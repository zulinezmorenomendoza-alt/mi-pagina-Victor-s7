<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
    padding: 24px;
    display: flex; justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    .tarjeta { background: #1b232e !important; border-color: #2b3644 !important; }
    .espacio-formulario { background: #182029 !important; border-color: #3a4552 !important; color: #9fb0c0 !important; }
  }
  .contenedor { width: 100%; max-width: 560px; }
  .tarjeta {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 28px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.3);
  }
  h1 { font-size: clamp(22px, 5vw, 28px); margin: 0 0 12px; }
  .explicacion { margin: 0 0 24px; line-height: 1.55; }
  .espacio-formulario {
    border: 2px dashed #c3cdd8; border-radius: 10px;
    padding: 32px 20px; text-align: center;
    color: #6b7887; font-size: 14px; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <div class="tarjeta">
      <h1>Buzón de sugerencias</h1>
      <p class="explicacion">
        Aquí vas a poder dejar tus ideas y comentarios para mejorar cómo
        trabajamos en el área. Cualquier sugerencia es bienvenida.
      </p>
      <div class="espacio-formulario">
        Aquí va el formulario para dejar tu sugerencia (siguiente paso).
      </div>
    </div>
  </div>
</body>
</html>
